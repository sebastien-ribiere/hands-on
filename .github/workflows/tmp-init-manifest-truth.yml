name: Temporary init manifest truth check

on:
  push:
    branches: [fix/init-manifest-truth]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/init-manifest-truth
      - name: Patch CLI and source cache validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('golden-thread-cli/src/golden_thread/source.py')
          text = path.read_text()
          old = '''def ensure_available(project: Path, manifest) -> Path:\n    """Return the local source tree, restoring it from the manifest if absent.\n\n    A freshly cloned consumer project has a manifest but no cache. The manifest\n    is enough to restore the exact reviewed policy.\n    """\n    dest = source_dir(project)\n    if (dest / CATALOG_NAME).exists():\n        return dest\n    checkout_revision(manifest.resolved_source(project), manifest.revision, dest)\n    if not (dest / CATALOG_NAME).exists():\n        raise GoldenThreadError(\n            f"restored {manifest.source} at {manifest.revision} but found no "\n            f"{CATALOG_NAME}"\n        )\n    return dest\n'''
          new = '''def _cache_matches_manifest(dest: Path, revision: str) -> bool:\n    """Whether the disposable policy cache is exactly the manifest revision.\n\n    HEAD equality is not enough: a dirty cache could silently change policy\n    while still claiming the pinned commit. The cache is disposable, so any\n    doubt means rebuild it from the manifest.\n    """\n    if not (dest / CATALOG_NAME).exists():\n        return False\n    try:\n        head = _git("rev-parse", "HEAD", cwd=dest)\n        dirty = _git("status", "--porcelain", cwd=dest)\n    except GoldenThreadError:\n        return False\n    return head == revision and not dirty\n\n\ndef ensure_available(project: Path, manifest) -> Path:\n    """Return the exact policy tree pinned by the project's manifest.\n\n    `init` records the resolved commit in the manifest. `verify` and every\n    command that consumes policy must derive their policy from that recorded\n    revision, never from whatever happens to be left in the local cache.\n    """\n    dest = source_dir(project)\n    if _cache_matches_manifest(dest, manifest.revision):\n        return dest\n\n    checkout_revision(manifest.resolved_source(project), manifest.revision, dest)\n    if not (dest / CATALOG_NAME).exists():\n        raise GoldenThreadError(\n            f"restored {manifest.source} at {manifest.revision} but found no "\n            f"{CATALOG_NAME}"\n        )\n    return dest\n'''
          if old not in text:
              raise SystemExit('source.py target not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('golden-thread-cli/src/golden_thread/cli.py')
          text = path.read_text()
          text = text.replace('import argparse\nimport sys\n', 'import argparse\nimport os\nimport shlex\nimport sys\n')
          marker = 'def _line(label: str, value: str) -> str:\n    return f"{label.ljust(LABEL_WIDTH)}{value}"\n\n\n'
          helper = '''def _next_command(args: argparse.Namespace, action: str) -> str:\n    """A follow-up command that stays on this CLI and this project."""\n    executable = os.environ.get("GOLDEN_THREAD_SELF", "golden-thread")\n    parts = [shlex.quote(executable)]\n    if args.project != ".":\n        parts.extend(["-C", shlex.quote(args.project)])\n    parts.append(action)\n    return " ".join(parts)\n\n\n'''
          if marker not in text:
              raise SystemExit('cli helper insertion target not found')
          text = text.replace(marker, marker + helper, 1)
          text = text.replace('print(f"{INDENT}producer  {evidence.producer}")',
                              'print(f"{INDENT}tool      {evidence.producer}")')
          text = text.replace('print(_line("Version", manifest.ref))\n    print(_line("Revision", manifest.short_revision))',
                              'print(_line("Policy ref", manifest.ref))\n    print(_line("Policy SHA", manifest.short_revision))')
          text = text.replace('print(_line("Version", args.ref))\n    print(_line("Revision", revision))',
                              'print(_line("Policy ref", args.ref))\n    print(_line("Policy SHA", revision))')
          text = text.replace('print("Next          golden-thread verify")\n    return 0\n\n\ndef cmd_status',
                              'print(f"Next          {_next_command(args, \'verify\')}")\n    return 0\n\n\ndef cmd_status', 1)
          path.write_text(text)

          path = Path('golden-thread-cli/bin/golden-thread')
          text = path.read_text()
          old = 'exec env PYTHONPATH="${here}/../src${PYTHONPATH:+:$PYTHONPATH}" python3 -m golden_thread "$@"\n'
          new = 'exec env GOLDEN_THREAD_SELF="${here}/golden-thread" PYTHONPATH="${here}/../src${PYTHONPATH:+:$PYTHONPATH}" python3 -m golden_thread "$@"\n'
          if old not in text:
              raise SystemExit('bin wrapper target not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('golden-thread-cli/tests/test_cli_flow.py')
          text = path.read_text()
          anchor = '''def test_manifest_stays_minimal(cli, corporate_source, spellbook):\n'''
          tests = '''def test_verify_reports_the_policy_recorded_by_init(\n    cli, corporate_source, spellbook, capsys\n):\n    _run(cli, "-C", str(spellbook), "init",\n         "--source", str(corporate_source), "--ref", "v0.1.0")\n    capsys.readouterr()\n\n    assert _run(cli, "-C", str(spellbook), "verify") == 0\n    out = capsys.readouterr().out\n    assert "Policy ref    v0.1.0" in out\n    assert "Profile       academy-spells" in out\n    assert "Policy ref    v0.3.0" not in out\n\n\ndef test_verify_rebuilds_a_mutated_policy_cache_from_the_init_manifest(\n    cli, corporate_source, spellbook, capsys\n):\n    _run(cli, "-C", str(spellbook), "init",\n         "--source", str(corporate_source), "--ref", "v0.1.0")\n    cache = source_dir(spellbook)\n    rule = cache / "rules" / "ARCH-001.toml"\n    original = rule.read_text()\n    rule.write_text(original.replace(\n        "Protection spells must not depend on Fire",\n        "MUTATED LOCAL POLICY MUST NOT BE USED",\n    ))\n\n    assert _run(cli, "-C", str(spellbook), "verify") == 0\n    out = capsys.readouterr().out\n    assert "MUTATED LOCAL POLICY MUST NOT BE USED" not in out\n    assert "Protection spells must not depend on Fire" in out\n    assert rule.read_text() == original\n\n\n'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          path.write_text(text.replace(anchor, tests + anchor, 1))
          PY

          git diff --check
          python3 -m pytest golden-thread-cli/tests -q
          python3 -m pytest claude-code-adapter/tests -q

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add golden-thread-cli
          git commit -m 'fix: derive verification policy from init manifest'
          git push origin HEAD:fix/init-manifest-truth
