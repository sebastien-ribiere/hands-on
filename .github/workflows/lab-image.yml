name: Lab container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - LAB.md
      - golden-thread-cli/**
      - golden-thread-source/**
      - claude-code-adapter/**
      - demo-spellbook/**
      - demo/publish-source.sh
      - .github/workflows/lab-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - LAB.md
      - golden-thread-cli/**
      - golden-thread-source/**
      - claude-code-adapter/**
      - demo-spellbook/**
      - demo/publish-source.sh
      - .github/workflows/lab-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build lab image
        run: docker build --pull -t golden-thread-lab:test .

      - name: Verify participant environment
        run: |
          docker run --rm --entrypoint bash golden-thread-lab:test -lc '
            set -e
            test "$PWD" = /workspace/demo-spellbook
            command -v golden-thread
            golden-thread --help >/dev/null
            command -v claude
            claude --version
            bandit --version
            pytest --version
            git -C ../.demo/golden-thread-source rev-parse --verify v0.1.0^{commit} >/dev/null
            git -C ../.demo/golden-thread-source rev-parse --verify v0.2.0^{commit} >/dev/null
            git -C ../.demo/golden-thread-source rev-parse --verify v0.3.0^{commit} >/dev/null
            test ! -f golden-thread.json
            git -C /workspace status --porcelain | test ! -s /dev/stdin
          '

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:lab
            ghcr.io/${{ github.repository }}:lab-${{ github.sha }}
