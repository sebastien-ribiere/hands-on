name: Temporary readiness check

on:
  push:
    branches:
      - fix/readiness-path-consistency

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest==8.3.4 bandit==1.9.4
      - run: python -m pytest golden-thread-cli/tests -q
      - run: python -m pytest claude-code-adapter/tests -q
