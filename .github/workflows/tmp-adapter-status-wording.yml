name: Temporary adapter path status wording

on:
  push:
    branches: [fix/adapter-path-status-wording]

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adapter-path-status-wording
      - name: Run adapter tests
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest claude-code-adapter/tests -q
