name: Temporary CLI policy labels

on:
  push:
    branches: [fix/init-manifest-truth]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/init-manifest-truth
      - name: Patch and test
        run: |
          python3 -m pip install -q pytest
          python3 - <<'PY'
          from pathlib import Path

          p = Path('golden-thread-cli/src/golden_thread/cli.py')
          s = p.read_text()
          s = s.replace('import argparse\nimport sys\n', 'import argparse\nimport os\nimport shlex\nimport sys\n')
          anchor = 'def _line(label: str, value: str) -> str:\n    return f"{label.ljust(LABEL_WIDTH)}{value}"\n\n\n'
          helper = '''def _next_command(args: argparse.Namespace, action: str) -> str:\n    """Render a follow-up command that preserves the selected project."""\n    executable = os.environ.get("GOLDEN_THREAD_SELF", "golden-thread")\n    parts = [shlex.quote(executable)]\n    if args.project != ".":\n        parts.extend(["-C", shlex.quote(args.project)])\n    parts.append(action)\n    return " ".join(parts)\n\n\n'''
          if helper not in s:
              s = s.replace(anchor, anchor + helper, 1)
          s = s.replace('print(f"{INDENT}producer  {evidence.producer}")', 'print(f"{INDENT}tool      {evidence.producer}")')
          s = s.replace('print(_line("Version", manifest.ref))\n    print(_line("Revision", manifest.short_revision))', 'print(_line("Policy ref", manifest.ref))\n    print(_line("Policy SHA", manifest.short_revision))')
          s = s.replace('print(_line("Version", args.ref))\n    print(_line("Revision", revision))', 'print(_line("Policy ref", args.ref))\n    print(_line("Policy SHA", revision))')
          s = s.replace('print("Next          golden-thread verify")\n    return 0\n\n\ndef cmd_status', 'print(f"Next          {_next_command(args, \'verify\')}")\n    return 0\n\n\ndef cmd_status', 1)
          p.write_text(s)

          p = Path('golden-thread-cli/bin/golden-thread')
          s = p.read_text()
          s = s.replace('exec env PYTHONPATH="${here}/../src${PYTHONPATH:+:$PYTHONPATH}" python3 -m golden_thread "$@"', 'exec env GOLDEN_THREAD_SELF="${here}/golden-thread" PYTHONPATH="${here}/../src${PYTHONPATH:+:$PYTHONPATH}" python3 -m golden_thread "$@"')
          p.write_text(s)

          p = Path('golden-thread-cli/tests/test_cli_flow.py')
          s = p.read_text()
          s = s.replace('assert "Version       v0.1.0" in out', 'assert "Policy ref    v0.1.0" in out')
          marker = 'def test_manifest_stays_minimal(cli, corporate_source, spellbook):\n'
          extra = '''def test_verify_reports_policy_from_init_not_cli_version(\n    cli, corporate_source, spellbook, capsys\n):\n    _run(cli, "-C", str(spellbook), "init",\n         "--source", str(corporate_source), "--ref", "v0.1.0")\n    capsys.readouterr()\n    assert _run(cli, "-C", str(spellbook), "verify") == 0\n    out = capsys.readouterr().out\n    assert "Policy ref    v0.1.0" in out\n    assert "Profile       academy-spells" in out\n    assert "tool      golden-thread 0.3.0" in out\n\n\ndef test_init_next_preserves_project(cli, corporate_source, spellbook, capsys):\n    _run(cli, "-C", str(spellbook), "init",\n         "--source", str(corporate_source), "--ref", "v0.1.0")\n    out = capsys.readouterr().out\n    assert f"Next          golden-thread -C {spellbook} verify" in out\n\n\n'''
          if 'test_verify_reports_policy_from_init_not_cli_version' not in s:
              s = s.replace(marker, extra + marker, 1)
          p.write_text(s)

          p = Path('golden-thread-cli/tests/test_evidence.py')
          s = p.read_text().replace('assert "producer  golden-thread" in out', 'assert "tool      golden-thread" in out')
          p.write_text(s)
          PY
          git diff --check
          python3 -m pytest golden-thread-cli/tests -q
          python3 -m pytest claude-code-adapter/tests -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add golden-thread-cli
          git commit -m 'fix: distinguish policy version from CLI version'
          git push origin HEAD:fix/init-manifest-truth
