name: Temporary README alignment

on:
  push:
    branches:
      - docs/align-current-model

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/align-current-model
      - name: Align documentation with current model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text()

          replacements = [
              (
                  'evidence that no longer describes the code is reported as **STALE**\n'
                  'rather than quietly reused.',
                  'evidence that no longer describes the work or the requirement is reported as **STALE**\n'
                  'rather than quietly reused.'
              ),
              (
                  '`COOKIE-001` requires that cookies were prepared and shared with the team. It is\n'
                  'absurd on purpose, and it is doing real work.',
                  '`COOKIE-001` requires that cookies were prepared and shared with the team. It is\n'
                  'a deliberately unexpected house rule, and it is doing real work.'
              ),
              (
                  'One record per requirement, answering five questions and nothing more:',
                  'One record per requirement, answering six questions and nothing more:'
              ),
              (
                  '### The subject, and why old evidence cannot be reused\n\n'
                  'The invalidation mechanism is one thing only:\n\n'
                  '> **a `sha256` digest over the sorted `(relative path, sha256(content))` pairs\n'
                  '> of the exact files the check engine read.**\n\n'
                  '`status` re-identifies the subject and compares. Equal, and the record still\n'
                  'speaks about the code in front of us. Different, and it does not — so it is\n'
                  'reported as STALE, never as a verdict.\n\n'
                  'The digest covers the three ways a subject can change (content edited, file\n'
                  'added, file removed). It deliberately covers *nothing else*: editing a README\n'
                  'does not invalidate an architecture verdict, because false invalidation is how\n'
                  'a staleness mechanism gets ignored.\n\n'
                  'A Git revision is recorded when one is available, but it is **descriptive\n'
                  'only**. A worktree with uncommitted work is not identified by its HEAD, and a\n'
                  'project is not always its own repository.\n\n'
                  'A record is also stale when the **method** changed — a different Golden Thread\n'
                  'revision, or a different profile. Evidence produced under `v0.1.0` says nothing\n'
                  "about `v0.2.0`'s rules.",
                  '### Freshness: the work and the requirement, independently\n\n'
                  'Freshness has two independent axes. A record remains current only while both\n'
                  'the subject it describes and the requirement it answered are unchanged.\n\n'
                  'The **subject digest** is a `sha256` over the sorted `(relative path,\n'
                  'sha256(content))` pairs of the exact files the check engine read. `status`\n'
                  're-identifies that subject. Editing, adding or removing one of those files makes\n'
                  'the evidence STALE; changing an unrelated file does not.\n\n'
                  'The **requirement fingerprint** identifies the semantics of the individual\n'
                  'requirement: its rule data plus policy artefacts it explicitly pins, such as a\n'
                  'readiness rubric. A move from `v0.2.0` to `v0.3.0`, or from one profile to\n'
                  'another, does not invalidate evidence merely because the container changed. If\n'
                  '`DOR-001` and its rubric are unchanged, its evidence can remain current while\n'
                  'the new profile adds `TEST-001`, `SEC-001`, `DOC-001` and `COOKIE-001`.\n\n'
                  'The Git ref, resolved revision and profile are still recorded as provenance.\n'
                  'They are not the identity of a requirement. For evidence written before\n'
                  '`requirementFingerprint` existed, Golden Thread keeps the old conservative\n'
                  'behaviour: a profile or policy revision change makes that legacy record STALE\n'
                  'because semantic equivalence cannot be established after the fact.\n\n'
                  'A Git revision on the subject is descriptive only. A worktree with uncommitted\n'
                  'work is not identified by its HEAD, and a project is not always its own\n'
                  'repository.'
              ),
              (
                  '| `STALE` | evidence exists but no longer describes this code or this policy | 3 |',
                  '| `STALE` | evidence exists but no longer describes the current subject or requirement | 3 |'
              ),
              (
                  'One fidelity gap, stated because it matters for what this proves: GitLab checks\n'
                  'out a commit, this stages the working tree. The difference shows up for exactly\n'
                  'one file — `demo-spellbook/golden-thread-attestations.json`, which a real\n'
                  'project commits and this demo gitignores because every run rewrites it.',
                  'One fidelity gap, stated because it matters for what this proves: GitLab checks\n'
                  'out a commit, while this helper stages the current working tree. For a faithful\n'
                  'rehearsal, commit the delivery state first — including\n'
                  '`demo-spellbook/golden-thread-attestations.json`. The helper does not pretend an\n'
                  'uncommitted working tree is the same thing as a GitLab checkout.'
              ),
              (
                  '      golden-thread-attestations.json   committed in a real project — see below',
                  '      golden-thread-attestations.json   committed — human claims travel to CI and review'
              ),
              (
                  '`verify` produces evidence; `status` only reads it. Re-identifying a subject is\n'
                  'not producing evidence: `status` runs no check, it establishes whether what was\n'
                  'recorded still applies.',
                  '`verify` produces evidence; `status` only reads it. Re-identifying a subject and\n'
                  'recomputing a requirement fingerprint are not producing evidence: `status` runs\n'
                  'no check, it establishes whether what was recorded still applies.'
              ),
              (
                  '## Tests\n\n'
                  '    python3 -m pytest golden-thread-cli/tests claude-code-adapter/tests -q\n\n'
                  '193 tests. One of them runs bandit for real and is skipped — not faked — when\n'
                  'bandit is not installed: a parser that agrees with its own fixture and\n'
                  'disagrees with the tool proves nothing. It probes by *running* `bandit\n'
                  '--version` rather than by looking for a file with that name, because a broken\n'
                  'shim on `PATH` answers `shutil.which` perfectly well.\n\n'
                  '`test_record_compatibility.py` loads literal Spike 2 and Spike 4 evidence\n'
                  'shapes. The three fields Spike 5 added — `findings`, `blocking`, `command` —\n'
                  'are additive with empty defaults, and the symptom of breaking that would not be\n'
                  'a crash: an unreadable record is silently dropped, and the project quietly\n'
                  'reports INCOMPLETE.',
                  '## Tests\n\n'
                  'Run the suites separately:\n\n'
                  '    python3 -m pytest golden-thread-cli/tests -q\n'
                  '    python3 -m pytest claude-code-adapter/tests -q\n\n'
                  'Both directories contain a package-less `conftest.py`; combining them in one\n'
                  'pytest invocation can bind the second suite to fixtures from the first. The\n'
                  'adapter README documents the same constraint.\n\n'
                  'The security suite runs bandit for real and skips that integration check — it\n'
                  'does not fake it — when bandit is not installed. A parser that agrees with its\n'
                  'own fixture and disagrees with the tool proves nothing.\n\n'
                  '`test_record_compatibility.py` loads literal older evidence shapes. Additive\n'
                  'fields such as `findings`, `blocking`, `command` and\n'
                  '`requirementFingerprint` keep conservative defaults so old records still load;\n'
                  'legacy records without a fingerprint retain conservative freshness semantics.'
              ),
              (
                  '    3   STALE: evidence exists but no longer describes this project',
                  '    3   STALE: evidence exists but no longer describes the current subject or requirement'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'README.md replacement target not found:\n{old[:160]}')
              text = text.replace(old, new, 1)

          root.write_text(text)

          adapter = Path('claude-code-adapter/README.md')
          text = adapter.read_text()
          adapter_replacements = [
              (
                  '(`ON PATH` / `OFF PATH` / `STALE` / `INCOMPLETE`) with, per requirement, the',
                  '(`ON PATH` / `OFF PATH` / `NOT READY` / `STALE` / `INCOMPLETE`) with, per requirement, the'
              ),
              (
                  '13 tests: SessionStart\'s context in each path state, PreToolUse\'s silence on\n'
                  '`ON PATH` and its message (never a denial) in every other state, and the two\n'
                  'structural guards described above.\n\n'
                  'Run this suite and `golden-thread-cli/tests` as two separate `pytest`\n'
                  'invocations, not one combined command: both directories have a same-named,\n'
                  'package-less `conftest.py`, and pytest\'s default import mode caches the first\n'
                  'one it loads under the module name `conftest`, so a single invocation covering\n'
                  'both silently binds the second suite to the wrong fixtures.',
                  'The suite covers SessionStart context, PreToolUse signalling, rendering and the\n'
                  'structural guards described above.\n\n'
                  'Run this suite and `golden-thread-cli/tests` as two separate `pytest`\n'
                  'invocations, not one combined command: both directories have a same-named,\n'
                  'package-less `conftest.py`, and pytest\'s default import mode caches the first\n'
                  'one it loads under the module name `conftest`, so a single invocation covering\n'
                  'both silently binds the second suite to the wrong fixtures.'
              ),
              (
                  '51 tests, unchanged, still green -- including\n'
                  '`test_core_is_harness_agnostic.py`, which greps the core\'s source for any\n'
                  'reference to `claude`, `anthropic`, `.mcp`, `copilot` or `cursor` and fails\n'
                  'if it finds one.',
                  'The core suite includes `test_core_is_harness_agnostic.py`, which greps the\n'
                  'core\'s source for any reference to `claude`, `anthropic`, `.mcp`, `copilot` or\n'
                  '`cursor` and fails if it finds one.'
              ),
          ]
          for old, new in adapter_replacements:
              if old not in text:
                  raise SystemExit(f'Adapter README replacement target not found:\n{old[:160]}')
              text = text.replace(old, new, 1)
          adapter.write_text(text)
          PY

          git diff --check
          grep -q 'requirement fingerprint' README.md
          grep -q 'python3 -m pytest golden-thread-cli/tests -q' README.md
          grep -q 'python3 -m pytest claude-code-adapter/tests -q' README.md
          ! grep -q 'python3 -m pytest golden-thread-cli/tests claude-code-adapter/tests -q' README.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md claude-code-adapter/README.md
          git commit -m 'docs: align README with current evidence model'
          git push origin HEAD:docs/align-current-model
